version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_GOOGLE_API_KEY=${VITE_GOOGLE_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    networks:
      - shopevalley-network

networks:
  shopevalley-network:
    driver: bridge
